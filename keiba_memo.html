<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<title>競馬メモ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap');
:root{
  --bg:#f5f5f7;--bg2:#ffffff;--bg3:#f0f0f2;--bg4:#e8e8ec;
  --border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.14);
  --text:#1a1a2e;--text2:#666680;--text3:#aaaabc;
  --accent:#b8943a;--accent2:#d4aa50;
  --live:#cc3333;--live-bg:rgba(204,51,51,0.08);
  --upcoming:#1a6abf;--upcoming-bg:rgba(26,106,191,0.08);
  --green:#1a8a4a;
  --radius:14px;--radius-sm:8px;--radius-xs:6px;
  --shadow:0 1px 4px rgba(0,0,0,0.08);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overscroll-behavior:none;}

.app-header{position:sticky;top:0;z-index:200;background:rgba(255,255,255,0.95);backdrop-filter:blur(16px);border-bottom:0.5px solid var(--border2);padding:12px 16px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);}
.logo{font-family:'DM Mono',monospace;font-size:13px;font-weight:500;color:var(--accent);letter-spacing:0.1em;}
.header-tabs{display:flex;gap:4px;margin-left:auto;}
.htab{padding:6px 10px;border-radius:20px;border:0.5px solid var(--border2);background:none;color:var(--text2);font-size:12px;font-family:'Noto Sans JP',sans-serif;cursor:pointer;white-space:nowrap;}
.htab.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700;}

.main{padding:14px;padding-bottom:120px;}
.page{display:none;}.page.active{display:block;}

/* CSV */
.csv-toggle{width:100%;padding:12px 16px;background:var(--bg2);border:0.5px solid var(--border2);border-radius:var(--radius);color:var(--accent);font-size:14px;font-family:'Noto Sans JP',sans-serif;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:8px;margin-bottom:12px;box-shadow:var(--shadow);}
.csv-toggle .arr{margin-left:auto;font-size:11px;color:var(--text3);transition:transform 0.2s;}
.csv-toggle.open .arr{transform:rotate(180deg);}
.csv-panel{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:14px;box-shadow:var(--shadow);display:none;}
.csv-panel.open{display:block;}
.csv-panel label{font-size:12px;color:var(--text2);display:block;margin-bottom:5px;}
.csv-panel code{font-family:'DM Mono',monospace;font-size:11px;background:var(--bg3);border-radius:var(--radius-sm);padding:8px 10px;display:block;margin-bottom:10px;color:#333;white-space:pre;overflow-x:auto;line-height:1.6;}
.csv-panel textarea{width:100%;background:var(--bg3);border:0.5px solid var(--border2);border-radius:var(--radius-sm);padding:9px 11px;font-size:12px;font-family:'DM Mono',monospace;color:var(--text);resize:vertical;min-height:80px;outline:none;}
.csv-panel textarea:focus{border-color:var(--accent);}
.btn-row{display:flex;gap:8px;margin-top:9px;align-items:center;flex-wrap:wrap;}
.btn{padding:9px 16px;border-radius:var(--radius-sm);border:0.5px solid var(--border2);background:var(--bg3);color:var(--text);font-size:13px;font-family:'Noto Sans JP',sans-serif;cursor:pointer;}
.btn:active{opacity:0.7;}
.btn-accent{background:var(--accent);color:#fff;font-weight:700;border-color:var(--accent);}
.btn-danger{color:var(--live);border-color:var(--live);}
.file-lbl{padding:9px 16px;border-radius:var(--radius-sm);border:0.5px solid var(--border2);background:var(--bg3);color:var(--text);font-size:13px;cursor:pointer;display:inline-block;}
.msg-ok{font-size:12px;color:var(--green);}
.msg-err{font-size:12px;color:var(--live);}

/* 日付タブ */
.date-tabs-wrap{margin-bottom:14px;overflow-x:auto;scrollbar-width:none;}
.date-tabs-wrap::-webkit-scrollbar{display:none;}
.date-tabs{display:flex;gap:6px;min-width:max-content;}
.dtab{padding:8px 14px;border-radius:22px;border:0.5px solid var(--border2);background:var(--bg2);color:var(--text2);font-size:13px;font-family:'Noto Sans JP',sans-serif;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px;box-shadow:var(--shadow);}
.dtab.active{border-color:var(--accent);color:var(--accent);font-weight:700;background:#fff;}
.dtab .tw-dot{width:7px;height:7px;border-radius:50%;background:var(--live);flex-shrink:0;}
.dtab .dcnt{font-size:10px;font-family:'DM Mono',monospace;background:var(--bg3);padding:1px 5px;border-radius:7px;color:var(--text3);}
.dtab.active .dcnt{background:rgba(184,148,58,0.15);color:var(--accent);}

/* 競馬場セクション */
.venue-section{margin-bottom:18px;}
.venue-heading{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding:2px 0;}
.v-bar{width:4px;height:18px;border-radius:2px;flex-shrink:0;}
.v-name{font-size:15px;font-weight:700;color:var(--text);}
.v-count{font-size:12px;color:var(--text3);font-family:'DM Mono',monospace;}
.v-live-badge{font-size:11px;color:var(--live);background:var(--live-bg);padding:2px 8px;border-radius:8px;}

/* レースカード */
.race-list{display:flex;flex-direction:column;gap:8px;}
.race-card{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);}
.race-card.expanded{border-color:rgba(184,148,58,0.4);}
.race-header{padding:13px 15px;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;}
.race-header:active{background:var(--bg3);}
.race-num{font-family:'DM Mono',monospace;font-size:12px;color:var(--text3);flex-shrink:0;width:26px;}
.race-header-center{flex:1;min-width:0;}
.race-title{font-size:15px;font-weight:700;color:var(--text);}
.race-meta{display:flex;gap:6px;align-items:center;margin-top:3px;flex-wrap:wrap;}



.r-meta{font-size:12px;color:var(--text2);}
.race-summary{font-size:11px;color:var(--text3);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;}
.rs-chip{display:inline-flex;align-items:center;gap:3px;}
.marks-summary{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px;}
.ms-chip{font-size:13px;font-weight:700;}
.chevron{color:var(--text3);font-size:12px;transition:transform 0.25s;flex-shrink:0;}
.race-card.expanded .chevron{transform:rotate(180deg);}
/* ヘッダーのボタン群 */
.race-header-btns{display:flex;gap:5px;flex-shrink:0;}
.race-edit-btn{padding:4px 9px;background:none;border:0.5px solid var(--border2);border-radius:var(--radius-xs);color:var(--text2);font-size:11px;font-family:'Noto Sans JP',sans-serif;cursor:pointer;}
.race-edit-btn:active{background:var(--bg3);}
.race-del-btn{padding:4px 9px;background:none;border:0.5px solid rgba(204,51,51,0.3);border-radius:var(--radius-xs);color:#cc3333;font-size:11px;font-family:'Noto Sans JP',sans-serif;cursor:pointer;}
.race-del-btn:active{background:var(--live-bg);}

.horse-list{display:none;border-top:0.5px solid var(--border);}
.race-card.expanded .horse-list{display:block;}

/* 馬カード */
.horse-card{border-bottom:0.5px solid var(--border);overflow:hidden;}
.horse-card:last-child{border-bottom:none;}
.horse-card.has-history{background:rgba(184,148,58,0.04);}
.horse-card.crossed-out{opacity:0.42;background:#f8f8f8;}
.horse-card.crossed-out .horse-name{color:var(--text3);text-decoration:line-through;}
.horse-main{padding:11px 13px;display:flex;align-items:center;gap:9px;}
.waku-badge{width:32px;height:32px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:13px;font-weight:700;flex-shrink:0;position:relative;}
.history-star{position:absolute;top:-5px;right:-5px;font-size:10px;line-height:1;}
.current-mark{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;font-size:16px;font-weight:900;cursor:pointer;border:2px solid transparent;font-family:'Noto Sans JP',sans-serif;flex-shrink:0;transition:transform 0.1s;}
.current-mark:active{transform:scale(0.88);}
.current-mark[data-m="◎"]{color:#b8600a;border-color:#b8600a;background:rgba(184,96,10,0.1);}
.current-mark[data-m="○"]{color:#1a5abf;border-color:#1a5abf;background:rgba(26,90,191,0.1);}
.current-mark[data-m="▲"]{color:#cc3333;border-color:#cc3333;background:rgba(204,51,51,0.1);}
.current-mark[data-m="△"]{color:#1a8a4a;border-color:#1a8a4a;background:rgba(26,138,74,0.1);}
.current-mark[data-m="×"]{color:#999;border-color:#ccc;background:rgba(0,0,0,0.05);}
.current-mark[data-m="―"]{color:#ccc;border-color:transparent;background:var(--bg3);}
.horse-info{flex:1;min-width:0;}
.horse-name-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.horse-name{font-size:14px;font-weight:700;color:var(--text);}
.history-badge{font-size:10px;background:rgba(184,148,58,0.12);color:var(--accent);padding:2px 6px;border-radius:7px;font-family:'DM Mono',monospace;white-space:nowrap;}
.horse-sub{font-size:12px;color:var(--text2);margin-top:2px;display:flex;gap:8px;}

.memo-prev{font-size:11px;color:var(--text3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px;}
.memo-btn{padding:6px 10px;background:none;border:0.5px solid var(--border2);border-radius:var(--radius-xs);color:var(--text2);font-size:12px;font-family:'Noto Sans JP',sans-serif;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.memo-btn:active{background:var(--bg3);}
.memo-btn.has-memo{border-color:var(--accent);color:var(--accent);}
.memo-area{display:none;border-top:0.5px solid var(--border);padding:11px 13px;background:var(--bg3);}
.memo-area.open{display:block;}
.history-block{margin-bottom:9px;}
.history-title{font-size:11px;color:var(--text3);margin-bottom:5px;}
.history-entry{background:var(--bg2);border-radius:var(--radius-xs);padding:7px 9px;margin-bottom:4px;border:0.5px solid var(--border);}
.h-date{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);margin-bottom:2px;}
.h-text{font-size:12px;color:var(--text);line-height:1.5;}
.phrase-btns{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px;}
.phrase-btn{padding:5px 11px;border-radius:12px;border:0.5px solid var(--border2);background:var(--bg2);color:var(--text2);font-size:12px;font-family:'Noto Sans JP',sans-serif;cursor:pointer;}
.phrase-btn:active{color:var(--accent);}
.memo-area textarea{width:100%;background:var(--bg2);border:0.5px solid var(--border2);border-radius:var(--radius-sm);padding:9px 11px;font-size:14px;font-family:'Noto Sans JP',sans-serif;color:var(--text);resize:none;min-height:72px;outline:none;line-height:1.6;}
.memo-area textarea:focus{border-color:var(--accent);}
.memo-actions{display:flex;align-items:center;gap:8px;margin-top:7px;}
.save-btn{padding:8px 20px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);font-size:13px;font-family:'Noto Sans JP',sans-serif;font-weight:700;cursor:pointer;}
.save-btn:active{background:var(--accent2);}
.saved-msg{font-size:11px;color:var(--green);opacity:0;transition:opacity 0.3s;font-family:'DM Mono',monospace;}
.saved-msg.show{opacity:1;}

.mark-legend{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;box-shadow:var(--shadow);}
.ml-item{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--text2);}
.ml-sym{font-size:15px;font-weight:900;}

/* 編集モーダル */
.modal-overlay{display:none;position:fixed;inset:0;z-index:499;background:rgba(0,0,0,0.45);}
.modal-overlay.open{display:flex;align-items:flex-end;}
.edit-modal{width:100%;max-height:88vh;background:#fff;border-radius:var(--radius) var(--radius) 0 0;display:flex;flex-direction:column;overflow:hidden;}
.edit-modal-header{padding:14px 16px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0;}
.edit-modal-title{font-size:15px;font-weight:700;color:var(--text);flex:1;}
.edit-modal-close{width:28px;height:28px;border-radius:50%;border:0.5px solid var(--border2);background:none;color:var(--text2);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.edit-modal-body{flex:1;overflow-y:auto;padding:14px 16px;}
.edit-hint{font-size:12px;color:var(--text3);margin-bottom:12px;line-height:1.6;}
.edit-horse-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
.edit-horse-row{display:flex;align-items:center;gap:8px;background:var(--bg3);border-radius:var(--radius-sm);padding:9px 11px;}
.edit-num-input{width:50px;border:0.5px solid var(--border2);border-radius:var(--radius-xs);padding:6px 6px;font-size:14px;font-family:'DM Mono',monospace;font-weight:700;color:var(--text);background:#fff;text-align:center;outline:none;flex-shrink:0;}
.edit-num-input:focus{border-color:var(--accent);}
.edit-horse-info{flex:1;min-width:0;}
.edit-horse-name{font-size:14px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.edit-horse-jockey{font-size:12px;color:var(--text2);}
.edit-del-btn{width:28px;height:28px;border-radius:50%;border:0.5px solid rgba(204,51,51,0.4);background:none;color:#cc3333;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.edit-del-btn:active{background:var(--live-bg);}
.edit-modal-footer{padding:12px 16px;border-top:0.5px solid var(--border);display:flex;gap:8px;flex-shrink:0;}
.edit-save-btn{flex:1;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);font-size:14px;font-family:'Noto Sans JP',sans-serif;font-weight:700;cursor:pointer;}
.edit-save-btn:active{background:var(--accent2);}
.edit-cancel-btn{padding:12px 20px;background:none;border:0.5px solid var(--border2);border-radius:var(--radius-sm);font-size:14px;font-family:'Noto Sans JP',sans-serif;color:var(--text2);cursor:pointer;}

/* 印ポップアップ */
#popOverlay{display:none;position:fixed;inset:0;z-index:599;background:rgba(0,0,0,0.2);}
#popOverlay.open{display:block;}
.mark-popup{display:none;position:fixed;z-index:600;background:#fff;border:0.5px solid var(--border2);border-radius:var(--radius);padding:12px 14px;box-shadow:0 8px 32px rgba(0,0,0,0.18);}
.mark-popup.open{display:block;}
.mark-popup-title{font-size:12px;color:var(--text2);margin-bottom:8px;font-weight:500;}
.mark-popup-inner{display:flex;gap:8px;align-items:center;}
.mpbtn{width:38px;height:38px;border-radius:50%;border:2px solid transparent;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:900;cursor:pointer;background:var(--bg3);font-family:'Noto Sans JP',sans-serif;}
.mpbtn:active{transform:scale(0.88);}
.mpbtn[data-m="◎"]{color:#b8600a;}.mpbtn[data-m="◎"].on{background:rgba(184,96,10,0.12);border-color:#b8600a;}
.mpbtn[data-m="○"]{color:#1a5abf;}.mpbtn[data-m="○"].on{background:rgba(26,90,191,0.12);border-color:#1a5abf;}
.mpbtn[data-m="▲"]{color:#cc3333;}.mpbtn[data-m="▲"].on{background:rgba(204,51,51,0.12);border-color:#cc3333;}
.mpbtn[data-m="△"]{color:#1a8a4a;}.mpbtn[data-m="△"].on{background:rgba(26,138,74,0.12);border-color:#1a8a4a;}
.mpbtn[data-m="×"]{color:#999;}.mpbtn[data-m="×"].on{background:rgba(0,0,0,0.08);border-color:#ccc;}
.mpbtn[data-m="―"]{color:#bbb;font-size:14px;}.mpbtn[data-m="―"].on{background:rgba(0,0,0,0.06);border-color:#ccc;}

/* メモ履歴 */
.log-filter-wrap{overflow-x:auto;scrollbar-width:none;margin-bottom:14px;}
.log-filter-wrap::-webkit-scrollbar{display:none;}
.log-filter-tabs{display:flex;gap:6px;min-width:max-content;}
.lftab{padding:7px 14px;border-radius:20px;border:0.5px solid var(--border2);background:var(--bg2);color:var(--text2);font-size:13px;font-family:'Noto Sans JP',sans-serif;cursor:pointer;white-space:nowrap;flex-shrink:0;box-shadow:var(--shadow);}
.lftab.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700;}
.search-bar{margin-bottom:12px;}
.search-bar input{width:100%;background:var(--bg2);border:0.5px solid var(--border2);border-radius:var(--radius-sm);padding:9px 12px;font-size:14px;font-family:'Noto Sans JP',sans-serif;color:var(--text);outline:none;box-shadow:var(--shadow);}
.search-bar input:focus{border-color:var(--accent);}
.date-group{margin-bottom:20px;}
.date-heading{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.date-label{font-size:14px;font-weight:700;color:var(--accent);font-family:'DM Mono',monospace;}
.date-count{font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;}
.date-line{flex:1;height:0.5px;background:var(--border2);}
.venue-group{margin-bottom:12px;}
.venue-group-heading{display:flex;align-items:center;gap:8px;margin-bottom:7px;padding-left:2px;}
.vg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.vg-name{font-size:13px;font-weight:700;color:var(--text2);}
.vg-cnt{font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;}
.memo-log-list{display:flex;flex-direction:column;gap:8px;}
.memo-log-card{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);}
.memo-log-header{padding:10px 14px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;gap:8px;background:var(--bg3);}
.mlh-mark{font-size:16px;font-weight:900;}
.mlh-name{font-size:14px;font-weight:700;color:var(--text);flex:1;}
.mlh-race{font-size:11px;color:var(--text3);}
.memo-log-entries{padding:10px 14px;display:flex;flex-direction:column;gap:6px;}
.mle{background:var(--bg3);border-radius:var(--radius-xs);padding:8px 10px;}
.mle-meta{font-size:10px;color:var(--text3);font-family:'DM Mono',monospace;margin-bottom:3px;display:flex;gap:8px;align-items:center;}
.mle-mark{font-size:14px;font-weight:900;}
.mle-text{font-size:13px;color:var(--text);line-height:1.6;}

/* 設定 */
.settings-section{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow);}
.section-title{font-size:13px;font-weight:500;color:var(--text2);margin-bottom:10px;}
.phrase-list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;}
.phrase-item{display:flex;gap:6px;align-items:center;}
.phrase-item input{flex:1;background:var(--bg3);border:0.5px solid var(--border2);border-radius:var(--radius-sm);padding:8px 10px;font-size:13px;font-family:'Noto Sans JP',sans-serif;color:var(--text);outline:none;}
.phrase-item input:focus{border-color:var(--accent);}
.del-btn{width:28px;height:28px;border-radius:50%;border:0.5px solid var(--border2);background:none;color:var(--text3);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.empty{text-align:center;padding:50px 20px;color:var(--text3);}
.empty .e-icon{font-size:44px;margin-bottom:10px;}
.empty p{font-size:14px;line-height:1.8;}
</style>
</head>
<body>

<header class="app-header">
  <span style="font-size:18px">🐎</span>
  <span class="logo">KEIBA MEMO</span>
  <div class="header-tabs">
    <button class="htab active" onclick="showPage('races',this)">出馬表</button>
    <button class="htab" onclick="showPage('memolog',this)">メモ履歴</button>
    <button class="htab" onclick="showPage('settings',this)">設定</button>
  </div>
</header>

<!-- 印ポップアップ -->
<div id="popOverlay" onclick="closeMarkPopup()"></div>
<div id="markPopup" class="mark-popup">
  <div class="mark-popup-title" id="popupTitle"></div>
  <div class="mark-popup-inner" id="popupInner"></div>
</div>

<!-- 編集モーダル -->
<div id="editOverlay" class="modal-overlay" onclick="closeEditModal(event)">
  <div class="edit-modal" onclick="event.stopPropagation()">
    <div class="edit-modal-header">
      <span class="edit-modal-title" id="editModalTitle">出馬表を編集</span>
      <button class="edit-modal-close" onclick="closeEditModal()">×</button>
    </div>
    <div class="edit-modal-body">
      <p class="edit-hint">・馬番を変更して保存すると番号順に並び替えられます<br>・空欄または0の馬番は末尾に移動します<br>・枠順は頭数と馬番から自動で決まります</p>
      <div id="editHorseList" class="edit-horse-list"></div>
    </div>
    <div class="edit-modal-footer">
      <button class="edit-cancel-btn" onclick="closeEditModal()">キャンセル</button>

</div>

<div class="main">
  <div id="page-races" class="page active">

      <code>競馬場,日付,レース名,コース,馬番,馬名,騎手
阪神,2026/04/12,阪神11R,芝1600m,1,馬名A,騎手A</code>
      <textarea id="csvInput" placeholder="ここにCSVテキストを貼り付け..."></textarea>

        <button class="btn btn-accent" onclick="importCsv()">追加で取り込む</button>
        <button class="btn btn-danger" onclick="replaceWithCsv()">入れ替える</button>
        <label class="file-lbl">ファイルを選択<input type="file" accept=".csv" style="display:none" onchange="loadFile(event)"></label>
        <span id="csvMsg"></span>

      <span class="ml-item"><span class="ml-sym" style="color:#b8600a">◎</span>本命</span>

      <span class="ml-item"><span class="ml-sym" style="color:#cc3333">▲</span>単穴</span>
      <span class="ml-item"><span class="ml-sym" style="color:#1a8a4a">△</span>連下</span>
      <span class="ml-item"><span class="ml-sym" style="color:#999">×</span>消し</span>

      <div class="date-tabs" id="dateTabsInner"></div>

    <div class="search-bar"><input type="text" id="memoSearch" placeholder="馬名・レース名で検索..." oninput="renderMemoLog()"></div>
    <div class="log-filter-wrap"><div class="log-filter-tabs" id="logFilterTabs"></div></div>
    <div id="memoLogList"></div>
  </div>

      <div class="section-title">📝 定型文（ワンタッチメモ）</div>

      <button class="btn" onclick="addPhrase()" style="width:100%;margin-bottom:8px;">＋ 定型文を追加</button>
      <button class="btn btn-accent" onclick="savePhrases()" style="width:100%;">保存</button>
      <div id="phraseMsg" style="font-size:12px;color:var(--green);margin-top:6px;min-height:16px;"></div>
    </div>
    <div class="settings-section">
      <div class="section-title">🗑 データ管理</div>
      <button class="btn btn-danger" onclick="clearAll()" style="width:100%;">全メモ・印をリセット</button>
    </div>

<script>
// ===== 定数 =====
const MARKS=['◎','○','▲','△','×'];
const MC={'◎':'#b8600a','○':'#1a5abf','▲':'#cc3333','△':'#1a8a4a','×':'#999','―':'#ccc'};
const WC=[null,
  {bg:'#f5f5f5',fg:'#222',border:'#ccc'},
  {bg:'#333',fg:'#fff',border:'#555'},
  {bg:'#cc3333',fg:'#fff',border:'#aa2222'},
  {bg:'#2255cc',fg:'#fff',border:'#1a44aa'},
  {bg:'#e8b800',fg:'#333',border:'#c9a000'},
  {bg:'#228833',fg:'#fff',border:'#1a6628'},
  {bg:'#ee6600',fg:'#fff',border:'#cc5500'},
  {bg:'#cc1166',fg:'#fff',border:'#aa0044'},
];
const WCX=[{bg:'#7a6030',fg:'#fff',border:'#5a4820'},{bg:'#1a3060',fg:'#fff',border:'#0a2040'}];

// 頭数に応じた枠順カラー（JRA公式準拠）
function waku(n, total){
  total=total||18;
  if(total<=16){
    const w=Math.ceil(n/2);
    return(w>=1&&w<=8)?WC[w]:WC[8];
  }
  if(total===17){
    if(n<=12){return WC[Math.ceil(n/2)];}
    if(n<=15){return WC[7];}
    return WC[8];
  }
  // 18頭以上: 1-12→1-6枠, 13-15→オレンジ(7枠), 16-18→ピンク(8枠)
  if(n<=12){return WC[Math.ceil(n/2)];}
  if(n<=15){return WC[7];}
  return WC[8];
}

const VC=['#1a6abf','#cc3333','#1a8a4a','#b8943a','#6644cc','#cc4488','#1a9aaa','#cc6600'];
function vcol(i){return VC[i%VC.length];}
const VK=['東京','中山','阪神','京都','中京','小倉','福島','新潟','函館','札幌'];
function gv(n){for(const v of VK)if(n.includes(v))return v;return'その他';}

// 今週の土日
function getThisWeekend(){
  const now=new Date();const day=now.getDay();
  const sat=new Date(now);sat.setDate(now.getDate()+(day===0?-1:6-day));
  const sun=new Date(sat);sun.setDate(sat.getDate()+1);
  const fmt=d=>`${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
  return[fmt(sat),fmt(sun)];
}
function isThisWeek(dk){return getThisWeekend().includes(dk);}
function todayKey(){
  const n=new Date();
  return`${n.getFullYear()}/${String(n.getMonth()+1).padStart(2,'0')}/${String(n.getDate()).padStart(2,'0')}`;
}
function formatDateLabel(dk){
  const[y,m,d]=dk.split('/');
  const dt=new Date(parseInt(y),parseInt(m)-1,parseInt(d));
  return`${parseInt(m)}/${parseInt(d)}(${'日月火水木金土'[dt.getDay()]})`;
}

// ===== ストレージ =====
let races=[],memos={},marks={},expanded={},memoOpen={},phrases=[],currentDate='ALL',logMode='date';
let editRaceId=null;

function load(){
  try{const s=localStorage.getItem('km10_races');if(s)races=JSON.parse(s);}catch(e){}
  try{const s=localStorage.getItem('km10_memos');if(s)memos=JSON.parse(s);}catch(e){}
  try{const s=localStorage.getItem('km10_marks');if(s)marks=JSON.parse(s);}catch(e){}
  try{const s=localStorage.getItem('km10_phrases');if(s)phrases=JSON.parse(s);}catch(e){}
  if(!phrases.length)phrases=['好調','前走好内容','距離○','要注意','消し','本命'];
}
function save(){
  try{
    localStorage.setItem('km10_races',JSON.stringify(races));
    localStorage.setItem('km10_memos',JSON.stringify(memos));
    localStorage.setItem('km10_marks',JSON.stringify(marks));
    localStorage.setItem('km10_phrases',JSON.stringify(phrases));
  }catch(e){}
}
load();

// ===== ページ切替 =====
function showPage(n,el){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.htab').forEach(t=>t.classList.remove('active'));
  document.getElementById('page-'+n).classList.add('active');
  if(el)el.classList.add('active');
  if(n==='memolog')renderMemoLog();
  if(n==='settings')renderSettings();
}

// ===== CSV =====
function normDate(s){
  if(!s)return todayKey();
  s=s.trim();
  const m=s.match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if(m)return`${m[1]}/${m[2].padStart(2,'0')}/${m[3].padStart(2,'0')}`;
  return todayKey();
}
function parseCsv(text){
  const lines=text.trim().split('\n').map(l=>l.trim()).filter(l=>l);
  if(lines.length<2)return{error:'データがありません'};
  const h=lines[0].split(',').map(s=>s.trim());
  const hasV=h.includes('競馬場'),hasD=h.includes('日付');
  for(const n of['レース名','馬番','馬名'])if(!h.includes(n))return{error:`「${n}」列が見つかりません`};
  const idx=k=>h.indexOf(k);
  const map={};
  for(let i=1;i<lines.length;i++){
    const c=lines[i].split(',').map(s=>s.trim());
    const rn=c[idx('レース名')];if(!rn)continue;
    const dk=hasD&&idx('日付')>=0?normDate(c[idx('日付')]):todayKey();
    const venue=hasV&&idx('競馬場')>=0?c[idx('競馬場')]:gv(rn);
    const mk=dk+'__'+rn;
    if(!map[mk])map[mk]={id:'r'+Object.keys(map).length,name:rn,venue,dateKey:dk,
      course:idx('コース')>=0?c[idx('コース')]:'',
      time:'',
      status:'upcoming',horses:[]};
    map[mk].horses.push({
      num:idx('馬番')>=0?(parseInt(c[idx('馬番')])||map[mk].horses.length+1):map[mk].horses.length+1,
      name:idx('馬名')>=0?c[idx('馬名')]:'',
      jockey:idx('騎手')>=0?c[idx('騎手')]:'',
      odds:''
    });
  }
  Object.values(map).forEach(r=>r.horses.sort((a,b)=>a.num-b.num));
  const result=Object.values(map);
  if(!result.length)return{error:'有効な行がありません'};
  return{races:result};
}
function importCsv(){
  const text=document.getElementById('csvInput').value;
  const msg=document.getElementById('csvMsg');
  if(!text.trim()){msg.className='msg-err';msg.textContent='テキストを入力してください';return;}
  const r=parseCsv(text);
  if(r.error){msg.className='msg-err';msg.textContent=r.error;return;}
  r.races.forEach(nr=>{
    const ex=races.find(er=>er.dateKey===nr.dateKey&&er.name===nr.name);
    if(!ex)races.push(nr);else Object.assign(ex,nr);
  });
  expanded={};memoOpen={};setInitialDate();save();renderAll();
  msg.className='msg-ok';msg.textContent=`${r.races.length}レース 追加しました ✓`;
}
function replaceWithCsv(){
  const text=document.getElementById('csvInput').value;
  const msg=document.getElementById('csvMsg');
  if(!text.trim()){msg.className='msg-err';msg.textContent='テキストを入力してください';return;}
  const r=parseCsv(text);
  if(r.error){msg.className='msg-err';msg.textContent=r.error;return;}
  races=r.races;expanded={};memoOpen={};setInitialDate();save();renderAll();
  document.getElementById('csvPanel').classList.remove('open');
  document.getElementById('csvToggle').classList.remove('open');
  msg.className='msg-ok';msg.textContent=`${r.races.length}レース 入れ替えました ✓`;
}
function loadFile(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const r=parseCsv(ev.target.result);
    if(r.error){alert(r.error);return;}
    r.races.forEach(nr=>{
      const ex=races.find(er=>er.dateKey===nr.dateKey&&er.name===nr.name);
      if(!ex)races.push(nr);else Object.assign(ex,nr);
    });
    expanded={};memoOpen={};setInitialDate();save();renderAll();
    alert(`${r.races.length}レース 追加しました！`);
  };
  reader.readAsText(file,'UTF-8');
}
function toggleCsv(){
  document.getElementById('csvPanel').classList.toggle('open');
  document.getElementById('csvToggle').classList.toggle('open');
}

// ===== 日付 =====
function getDateKeys(){
  const s=new Set(races.map(r=>r.dateKey));
  return[...s].sort((a,b)=>b.localeCompare(a));
}
function setInitialDate(){
  const dates=getDateKeys();
  if(!dates.length){currentDate='ALL';return;}
  const tw=dates.find(d=>isThisWeek(d));
  currentDate=tw||dates[0];
}
function selectDate(d){currentDate=d;renderAll();}
function renderAll(){renderDateTabs();renderRaceContent();}

function renderDateTabs(){
  const dates=getDateKeys();
  const wrap=document.getElementById('dateTabsWrap');
  const inner=document.getElementById('dateTabsInner');
  if(!dates.length){wrap.style.display='none';return;}
  wrap.style.display='block';
  inner.innerHTML=dates.map(d=>{
    const tw=isThisWeek(d);
    const cnt=races.filter(r=>r.dateKey===d).length;
    return`<button class="dtab ${currentDate===d?'active':''}" onclick="selectDate('${d}')">
      ${tw?'<span class="tw-dot"></span>':''}${formatDateLabel(d)}<span class="dcnt">${cnt}</span>
    </button>`;
  }).join('');
}

// ===== ヘルパー =====
function getHistory(name){return memos[name]||[];}
function getCurMemo(rid,num,name){return memos['__c__'+rid+'_'+num+'_'+(name||'')]||'';}
function getMark(rid,num,name){return marks[rid+'_'+num+'_'+(name||'')]||'―';}

// ===== 印ポップアップ =====
function openMarkPopup(key,horseName,btnEl){
  const cur=marks[key]||'―';
  document.getElementById('popupTitle').textContent=horseName;
  document.getElementById('popupInner').innerHTML=[...MARKS,'―'].map(m=>
    `<button class="mpbtn ${m===cur?'on':''}" data-m="${m}" onclick="setMark('${key}','${m}')">${m}</button>`
  ).join('');
  const popup=document.getElementById('markPopup');
  const rect=btnEl.getBoundingClientRect();
  popup.style.top=Math.min(rect.bottom+8,window.innerHeight-100)+'px';
  popup.style.left=Math.max(8,Math.min(rect.left-60,window.innerWidth-280))+'px';
  popup.classList.add('open');
  document.getElementById('popOverlay').classList.add('open');
}
function closeMarkPopup(){
  document.getElementById('markPopup').classList.remove('open');
  document.getElementById('popOverlay').classList.remove('open');
}
function setMark(key,m){
  if(m==='―')delete marks[key];else marks[key]=m;
  save();closeMarkPopup();renderRaceContent();
}

// ===== 編集モーダル =====
function openEditModal(rid){
  const race=races.find(r=>r.id===rid);
  if(!race)return;
  editRaceId=rid;
  document.getElementById('editModalTitle').textContent=race.name+' を編集';
  renderEditHorseList(race);
  document.getElementById('editOverlay').classList.add('open');
}
function closeEditModal(e){
  if(e&&e.target!==document.getElementById('editOverlay'))return;
  document.getElementById('editOverlay').classList.remove('open');
  editRaceId=null;
}
function renderEditHorseList(race){
  const el=document.getElementById('editHorseList');
  el.innerHTML=race.horses.map((h,i)=>`
    <div class="edit-horse-row" id="erow_${i}">
      <input class="edit-num-input" type="number" min="0" max="99" value="${h.num}" id="enum_${i}" placeholder="馬番">
      <div class="edit-horse-info">
        <div class="edit-horse-name">${h.name}</div>
        <div class="edit-horse-jockey">${h.jockey||''}</div>
      </div>
      <button class="edit-del-btn" onclick="editDelHorse(${i})">×</button>
    </div>
  `).join('');
}
function editDelHorse(idx){
  const race=races.find(r=>r.id===editRaceId);
  if(!race)return;
  if(!confirm(`「${race.horses[idx].name}」を削除しますか？`))return;
  race.horses.splice(idx,1);
  renderEditHorseList(race);
}
function saveEdit(){
  const race=races.find(r=>r.id===editRaceId);
  if(!race)return;
  // 各行から馬番を取得
  race.horses.forEach((h,i)=>{
    const input=document.getElementById('enum_'+i);
    if(input){
      const v=parseInt(input.value);
      h.num=isNaN(v)||v<=0?999:v;
    }
  });
  // 馬番順に並び替え（同じ番号は元の順序を維持）
  race.horses.sort((a,b)=>a.num-b.num);
  // 999（番号なし）は末尾に移動済みなのでそのまま
  save();
  document.getElementById('editOverlay').classList.remove('open');
  editRaceId=null;
  renderRaceContent();
}

// ===== レース削除 =====
function delRace(btn){
  const rid=btn.getAttribute('data-rid');
  if(!rid)return;
  const race=races.find(r=>r.id===rid);
  if(!race)return;
  if(!confirm('「'+race.name+'」を削除しますか？\nメモ・印は馬名履歴に残ります。'))return;
  races=races.filter(r=>r.id!==rid);
  delete expanded[rid];
  const remaining=races.filter(r=>r.dateKey===currentDate);
  if(!remaining.length)setInitialDate();
  save();renderAll();
}

// ===== 出馬表描画 =====
function renderRaceContent(){
  const el=document.getElementById('raceContent');
  if(!races.length){
    el.innerHTML=`<div class="empty"><div class="e-icon">🐎</div><p>CSVをインポートして<br>出馬表を追加してください</p></div>`;
    return;
  }
  const targetRaces=currentDate==='ALL'?races:races.filter(r=>r.dateKey===currentDate);
  if(!targetRaces.length){
    el.innerHTML=`<div class="empty"><div class="e-icon">📅</div><p>この日付のレースはありません</p></div>`;
    return;
  }
  const venueOrder=[];
  const venueMap={};
  targetRaces.forEach(r=>{
    if(!venueMap[r.venue]){venueMap[r.venue]=[];venueOrder.push(r.venue);}
    venueMap[r.venue].push(r);
  });
  el.innerHTML=venueOrder.map((venue,vi)=>{
    const vr=venueMap[venue].slice().sort((a,b)=>{
      const na=parseInt(a.name.match(/(\d+)R/)?.[1]||'99');
      const nb=parseInt(b.name.match(/(\d+)R/)?.[1]||'99');
      return na-nb;
    });
    const color=vcol(vi);
    const hasLive=vr.some(r=>r.status==='live');
    const racesHtml=vr.map(r=>{
      const isOpen=!!expanded[r.id];
      const memoC=r.horses.filter(h=>getCurMemo(r.id,h.num,h.name)).length;
      const histC=r.horses.filter(h=>getHistory(h.name).length>0).length;
      const markedH=r.horses.filter(h=>{const m=getMark(r.id,h.num,h.name);return m!=='―'&&m!=='×';});
      const marksSumHtml=markedH.length?`<div class="marks-summary">`+
        markedH.map(h=>{const m=getMark(r.id,h.num,h.name);return`<span class="ms-chip" style="color:${MC[m]}">${m}${h.num}</span>`;}).join('')+`</div>`:'';
      const horsesHtml=r.horses.map(h=>{
        const key=r.id+'_'+h.num+'_'+h.name;
        const cm=getCurMemo(r.id,h.num,h.name);
        const hist=getHistory(h.name);
        const hasHist=hist.length>0;
        const wc=waku(h.num,r.horses.length);
        const mk=getMark(r.id,h.num,h.name);
        const isCrossed=mk==='×';
        const isMemOpen=!!memoOpen[key];
        const histH=hasHist?`<div class="history-block"><div class="history-title">⏱ 過去のメモ（${hist.length}件）</div>${hist.slice(-3).reverse().map(e=>`<div class="history-entry"><div class="h-date">${e.raceName||''} ${e.date||''}</div><div class="h-text">${e.text}</div></div>`).join('')}</div>`:'';
        const phraseH=phrases.filter(p=>p.trim()).map(p=>`<button class="phrase-btn" onclick="insertPhrase('${key}','${p.replace(/'/g,"\\'")}')">＋${p}</button>`).join('');
        const safeKey=key.replace(/'/g,"\\'");
        const safeName=h.name.replace(/'/g,"\\'");
        const safeRname=r.name.replace(/'/g,"\\'");
        return`
          <div class="horse-card ${hasHist?'has-history':''} ${isCrossed?'crossed-out':''}" id="card_${r.id}_${h.num}">
            <div class="horse-main">
              <div class="waku-badge" style="background:${wc.bg};color:${wc.fg};border:2px solid ${wc.border}">
                ${h.num}${hasHist?'<span class="history-star">⭐</span>':''}
              </div>
              <span class="current-mark" data-m="${mk}" onclick="event.stopPropagation();openMarkPopup('${safeKey}','${safeName}',this)">${mk}</span>
              <div class="horse-info">
                <div class="horse-name-row">
                  <span class="horse-name">${h.name}</span>
                  ${hasHist?`<span class="history-badge">過去記録あり</span>`:''}
                </div>
                <div class="horse-sub">
                  <span>${h.jockey||'―'}</span>

                </div>
                ${cm?`<div class="memo-prev">📝 ${cm}</div>`:''}
              </div>
              <button class="memo-btn ${cm?'has-memo':''}" onclick="event.stopPropagation();toggleMemo('${safeKey}')">${cm?'✏️メモ':'メモ＋'}</button>
            </div>
            <div class="memo-area ${isMemOpen?'open':''}" id="memo_${r.id}_${h.num}">
              ${histH}
              ${phraseH?`<div class="phrase-btns">${phraseH}</div>`:''}
              <textarea id="ta_${r.id}_${h.num}" placeholder="この馬のメモ...">${cm}</textarea>
              <div class="memo-actions">
                <button class="save-btn" onclick="saveMemo('${r.id}','${h.num}','${safeName}','${safeRname}','${r.venue}')">保存</button>
                <span class="saved-msg" id="st_${r.id}_${h.num}">saved ✓</span>
              </div>
            </div>
          </div>`;
      }).join('');
      const rnm=r.name.match(/(\d+)R/);
      return`
        <div class="race-card ${isOpen?'expanded':''}" id="rc_${r.id}">
          <div class="race-header" onclick="toggleRace('${r.id}')">
            <span class="race-num">${rnm?rnm[1]+'R':''}</span>
            <div class="race-header-center">
              <div class="race-title">${r.name}</div>
              <div class="race-meta">
                ${r.course?`<span class="r-meta">${r.course}</span>`:''}

              </div>
              ${marksSumHtml}
              <div class="race-summary">
                ${memoC?`<span class="rs-chip">📝${memoC}頭</span>`:''}
                ${histC?`<span class="rs-chip">⏱${histC}頭</span>`:''}
              </div>
            </div>
            <div class="race-header-btns">
              <button class="race-edit-btn" onclick="event.stopPropagation();openEditModal('${r.id}')">編集</button>
              <button class="race-del-btn" data-rid="${r.id}" onclick="event.stopPropagation();delRace(this)">削除</button>
            </div>
            <span class="chevron">▾</span>
          </div>
          <div class="horse-list">${horsesHtml}</div>
        </div>`;
    }).join('');
    return`
      <div class="venue-section">
        <div class="venue-heading">
          <span class="v-bar" style="background:${color}"></span>
          <span class="v-name">${venue}</span>
          <span class="v-count">${vr.length}レース</span>
          ${hasLive?`<span class="v-live-badge">● 開催中</span>`:''}
        </div>
        <div class="race-list">${racesHtml}</div>
      </div>`;
  }).join('');
}

function toggleRace(id){expanded[id]=!expanded[id];renderRaceContent();}
function toggleMemo(key){
  memoOpen[key]=!memoOpen[key];
  const parts=key.split('_');
  const rid=parts[0],num=parts[1];
  const el=document.getElementById('memo_'+rid+'_'+num);
  if(el)el.classList.toggle('open',!!memoOpen[key]);
}
function insertPhrase(key,text){
  const parts=key.split('_');const rid=parts[0],num=parts[1];
  const ta=document.getElementById('ta_'+rid+'_'+num);
  if(!ta)return;ta.value=ta.value?ta.value+'　'+text:text;ta.focus();
}
function saveMemo(rid,num,name,rname,venue){
  const key=rid+'_'+num+'_'+name;
  const ta=document.getElementById('ta_'+rid+'_'+num);
  const text=ta?ta.value:'';
  const now=new Date();
  const date=now.toLocaleDateString('ja-JP',{year:'numeric',month:'numeric',day:'numeric'});
  const dateKey=`${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')}`;
  if(!memos[name])memos[name]=[];
  memos[name]=memos[name].filter(e=>e.raceId!==rid);
  if(text)memos[name].push({raceId:rid,raceName:rname,venue:venue||'',date,dateKey,text,mark:marks[key]||'―'});
  memos['__c__'+key]=text;
  save();
  const prev=document.querySelector(`#card_${rid}_${num} .memo-prev`);
  if(prev)prev.textContent=text?'📝 '+text:'';
  const btn=document.querySelector(`#card_${rid}_${num} .memo-btn`);
  if(btn){btn.textContent=text?'✏️メモ':'メモ＋';btn.className='memo-btn'+(text?' has-memo':'');}
  const st=document.getElementById('st_'+rid+'_'+num);
  if(st){st.classList.add('show');setTimeout(()=>st.classList.remove('show'),1500);}
}

// ===== メモ履歴 =====
function setLogMode(mode){logMode=mode;renderMemoLog();}
function getUniqueDates(){
  const s=new Set();
  Object.entries(memos).filter(([k])=>!k.startsWith('__c__')).forEach(([k,logs])=>{
    if(Array.isArray(logs))logs.forEach(e=>{if(e.dateKey)s.add(e.dateKey);});
  });
  return[...s].sort((a,b)=>b.localeCompare(a));
}
function renderMemoLog(){
  const q=(document.getElementById('memoSearch')?.value||'').trim();
  const dates=getUniqueDates();
  document.getElementById('logFilterTabs').innerHTML=`
    <button class="lftab ${logMode==='date'?'active':''}" onclick="setLogMode('date')">📅 日付別</button>
    <button class="lftab ${logMode==='horse'?'active':''}" onclick="setLogMode('horse')">🐴 馬名別</button>
    ${dates.map(d=>`<button class="lftab ${logMode===d?'active':''}" onclick="setLogMode('${d}')">${formatDateLabel(d)}</button>`).join('')}`;
  const el=document.getElementById('memoLogList');
  const allEntries=[];
  Object.entries(memos).filter(([k])=>!k.startsWith('__c__')).filter(([k,v])=>Array.isArray(v)&&v.length>0)
    .forEach(([horseName,logs])=>logs.forEach(log=>allEntries.push({horseName,...log})));
  if(!allEntries.length){el.innerHTML=`<div class="empty"><div class="e-icon">📝</div><p>まだメモがありません</p></div>`;return;}
  const filtered=allEntries.filter(e=>!q||e.horseName.includes(q)||e.raceName?.includes(q)||e.venue?.includes(q));
  if(!filtered.length){el.innerHTML=`<div class="empty"><div class="e-icon">🔍</div><p>該当するメモがありません</p></div>`;return;}
  if(logMode==='horse'){
    const byHorse={};
    filtered.forEach(e=>{if(!byHorse[e.horseName])byHorse[e.horseName]=[];byHorse[e.horseName].push(e);});
    el.innerHTML=`<div class="memo-log-list">`+Object.entries(byHorse).map(([name,logs])=>{
      const mk=logs[logs.length-1]?.mark||'―';
      return`<div class="memo-log-card">
        <div class="memo-log-header">
          ${mk!=='―'?`<span class="mlh-mark" style="color:${MC[mk]}">${mk}</span>`:''}
          <span class="mlh-name">${name}</span><span class="mlh-race">${logs.length}件</span>
        </div>
        <div class="memo-log-entries">
          ${logs.slice().reverse().map(e=>`<div class="mle">
            <div class="mle-meta">
              ${e.mark&&e.mark!=='―'?`<span class="mle-mark" style="color:${MC[e.mark]}">${e.mark}</span>`:''}
              <span>${e.venue||''}</span><span>${e.raceName||''}</span><span>${e.date||''}</span>
            </div>
            <div class="mle-text">${e.text}</div>
          </div>`).join('')}
        </div>
      </div>`;
    }).join('')+`</div>`;
  }else{
    const target=(logMode!=='date'&&logMode!=='horse')?logMode:null;
    const byDate={};
    filtered.filter(e=>!target||e.dateKey===target).forEach(e=>{
      const dk=e.dateKey||'不明';
      if(!byDate[dk])byDate[dk]={};
      const ven=e.venue||'その他';
      if(!byDate[dk][ven])byDate[dk][ven]=[];
      byDate[dk][ven].push(e);
    });
    const sortedDates=Object.keys(byDate).sort((a,b)=>b.localeCompare(a));
    if(!sortedDates.length){el.innerHTML=`<div class="empty"><div class="e-icon">📅</div><p>この日付のメモはありません</p></div>`;return;}
    el.innerHTML=sortedDates.map(dk=>{
      const venueMap=byDate[dk];
      const total=Object.values(venueMap).reduce((a,v)=>a+v.length,0);
      return`<div class="date-group">
        <div class="date-heading">
          <span class="date-label">${formatDateLabel(dk)}</span>
          <span class="date-count">${total}件</span>
          <span class="date-line"></span>
        </div>
        ${Object.entries(venueMap).map(([ven,entries],vi)=>`
          <div class="venue-group">
            <div class="venue-group-heading">
              <span class="vg-dot" style="background:${vcol(vi)}"></span>
              <span class="vg-name">${ven}</span><span class="vg-cnt">${entries.length}件</span>
            </div>
            <div class="memo-log-list">${entries.map(e=>`
              <div class="memo-log-card">
                <div class="memo-log-header">
                  ${e.mark&&e.mark!=='―'?`<span class="mlh-mark" style="color:${MC[e.mark]}">${e.mark}</span>`:''}
                  <span class="mlh-name">${e.horseName}</span>
                  <span class="mlh-race">${e.raceName||''}</span>
                </div>
                <div class="memo-log-entries"><div class="mle"><div class="mle-text">${e.text}</div></div></div>
              </div>`).join('')}
            </div>
          </div>`).join('')}
      </div>`;
    }).join('');
  }
}

// ===== 設定 =====
function renderSettings(){
  document.getElementById('phraseList').innerHTML=phrases.map((p,i)=>`
    <div class="phrase-item">
      <input type="text" value="${p}" id="phrase_${i}" placeholder="定型文を入力">
      <button class="del-btn" onclick="removePhrase(${i})">×</button>
    </div>`).join('');
}
function addPhrase(){phrases.push('');renderSettings();setTimeout(()=>{const ins=document.querySelectorAll('#phraseList input');if(ins.length)ins[ins.length-1].focus();},50);}
function removePhrase(i){phrases.splice(i,1);renderSettings();}
function savePhrases(){
  phrases=Array.from(document.querySelectorAll('#phraseList input')).map(el=>el.value.trim()).filter(v=>v);
  save();renderSettings();
  const msg=document.getElementById('phraseMsg');msg.textContent='保存しました ✓';setTimeout(()=>msg.textContent='',1500);
}
function clearAll(){
  if(!confirm('全てのメモ・印をリセットしますか？'))return;
  memos={};marks={};memoOpen={};save();renderRaceContent();alert('リセットしました');
}

if(races.length)setInitialDate();
renderAll();
</script>
